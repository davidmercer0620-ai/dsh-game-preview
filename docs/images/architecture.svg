<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" role="img" aria-label="How the game preview reaches the sidebar">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b93a7"/>
    </marker>
    <style>
      .box { fill: #f4f6fb; stroke: #c9d1e3; stroke-width: 1.5; }
      .box-accent { fill: #eef2ff; stroke: #8f9bd6; stroke-width: 1.5; }
      .title { font: 600 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2330; }
      .sub { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5b6478; }
      .label { font: 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #7b8397; }
      .flow { stroke: #8b93a7; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .caption { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7385; }
    </style>
  </defs>

  <rect width="980" height="400" fill="#ffffff"/>
  <text x="32" y="42" class="title" style="font-size:17px">How a game reaches the right sidebar</text>
  <text x="32" y="64" class="caption">Engine window → native capture → loopback HTTP → iframe bridge → panel</text>

  <!-- Row 1: capture chain -->
  <rect class="box" x="32" y="98" width="196" height="82" rx="10"/>
  <text x="48" y="126" class="title">Engine window</text>
  <text x="48" y="146" class="sub">Unity · Godot · Cocos</text>
  <text x="48" y="164" class="sub">or an exported build</text>

  <rect class="box" x="272" y="98" width="196" height="82" rx="10"/>
  <text x="288" y="126" class="title">window-capture.ps1</text>
  <text x="288" y="146" class="sub">PrintWindow + DPI</text>
  <text x="288" y="164" class="sub">JPEG frames, 15 fps</text>

  <rect class="box" x="512" y="98" width="196" height="82" rx="10"/>
  <text x="528" y="126" class="title">WindowCapture</text>
  <text x="528" y="146" class="sub">child process bridge</text>
  <text x="528" y="164" class="sub">frames + input back</text>

  <rect class="box-accent" x="752" y="98" width="196" height="82" rx="10"/>
  <text x="768" y="126" class="title">Loopback :7317</text>
  <text x="768" y="146" class="sub">15 same-origin routes</text>
  <text x="768" y="164" class="sub">+ agent tools</text>

  <path class="flow" d="M228 139 H268"/>
  <path class="flow" d="M468 139 H508"/>
  <path class="flow" d="M708 139 H748"/>
  <text x="232" y="132" class="label">capture</text>
  <text x="472" y="132" class="label">stdout</text>
  <text x="712" y="132" class="label">RPC</text>

  <!-- Row 2: the transport that actually works -->
  <rect class="box" x="32" y="230" width="196" height="82" rx="10"/>
  <text x="48" y="258" class="title">Desktop page</text>
  <text x="48" y="278" class="sub">dsh-app://app/</text>
  <text x="48" y="296" class="sub">fetch to loopback is blocked</text>

  <rect class="box-accent" x="272" y="230" width="196" height="82" rx="10"/>
  <text x="288" y="258" class="title">Bridge iframe</text>
  <text x="288" y="278" class="sub">GET /bridge → postMessage</text>
  <text x="288" y="296" class="sub">rebuilt after a restart</text>

  <rect class="box" x="512" y="230" width="196" height="82" rx="10"/>
  <text x="528" y="258" class="title">Right sidebar tab</text>
  <text x="528" y="278" class="sub">device frame · input</text>
  <text x="528" y="296" class="sub">crop · export · console</text>

  <path class="flow" d="M228 271 H268"/>
  <path class="flow" d="M468 271 H508"/>
  <text x="232" y="264" class="label">postMessage</text>
  <text x="472" y="264" class="label">frames</text>

  <!-- vertical link between rows -->
  <path class="flow" d="M850 184 V226"/>
  <text x="860" y="208" class="label">/api/state</text>

  <text x="32" y="356" class="caption">The preload blocks loopback fetch/XHR from the page, so the only transport is a hidden same-origin iframe plus postMessage; the panel probes bridge → XHR → fetch and self-heals.</text>
  <text x="32" y="376" class="caption">Native capture is Windows-only (PrintWindow); web builds are served straight into the device frame without capture.</text>
</svg>
